services:
  # SQL Database
  postgres:
    image: docker.io/postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: epoch_pg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      # Bound to loopback deliberately. Without an explicit host address Docker
      # publishes on 0.0.0.0 and inserts its own iptables rules, so a test
      # database with default credentials ends up reachable from the internet
      # on any host with a public interface, whatever the host firewall says.
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
